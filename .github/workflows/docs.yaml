# Generate the Sphinx documentation and deploy it to GitHub pages
#
# Is run on pushes to main and called by the build_and_release workflow.

name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yaml"
      - "docs/**"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"

  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-slim # single-cpu runner is enough for this workflow

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-groups --all-extras

      - name: Build documentation
        run: make docs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build/html

  deploy:
    needs: build-docs
    runs-on: ubuntu-slim # single-cpu runner is enough for this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
